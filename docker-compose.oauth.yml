name: tests-oauth

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0@sha256:f8ade94c1d0ad2f2fa7734a455fee5392764f402c43ca35e9af6bf63a2541dc9
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./oauth/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "18080"
      KC_HOSTNAME_STRICT: "false"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  server:
    image: ${TROGON_EVENTSTORE_SERVER_IMAGE:-ghcr.io/trogonstack/trogoneventstore:ci}
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      EVENTSTORE_CONFIG: /etc/eventstore/oauth.conf
      EVENTSTORE_CERTIFICATE_FILE: /etc/eventstore/certs/node1/node.crt
      EVENTSTORE_CERTIFICATE_PRIVATE_KEY_FILE: /etc/eventstore/certs/node1/node.key
      EVENTSTORE_TRUSTED_ROOT_CERTIFICATES_PATH: /etc/eventstore/certs/ca
      EVENTSTORE_ADVERTISE_HOST_TO_CLIENT_AS: localhost
      EVENTSTORE_ADVERTISE_NODE_PORT_TO_CLIENT_AS: "2116"
      EVENTSTORE_TELEMETRY_OPTOUT: "true"
      EVENTSTORE_LOG_FAILED_AUTHENTICATION_ATTEMPTS: "true"
    ports:
      - "2116:2113"
    volumes:
      - ./certs:/etc/eventstore/certs:ro
      - ./oauth/oauth.conf:/etc/eventstore/oauth.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfk https://localhost:2113/-/liveness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
